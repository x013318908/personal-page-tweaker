<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading Notes — サンプルページ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #243047; background: #f3f5f8; font: 15px/1.8 system-ui, sans-serif; }
    header { height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 42px; border-bottom: 1px solid #dce2eb; background: #fff; }
    .brand { font-size: 21px; font-weight: 750; letter-spacing: -.04em; }
    .brand span { color: #2457d6; }
    .sample { color: #748097; font-size: 11px; }
    .layout { display: grid; grid-template-columns: 174px 1fr; gap: 36px; max-width: 1060px; padding: 38px; margin: auto; }
    aside { color: #738097; font-size: 13px; }
    aside strong { color: #293852; display: block; padding: 10px 0 20px; }
    aside p { padding: 8px 14px; border-radius: 7px; }
    aside p:first-of-type { background: #e6ecfa; color: #2457d6; }
    .article { padding: 34px 36px; background: #fff; border: 1px solid #e2e7ef; border-radius: 14px; }
    .reading-badge { color: #2457d6; font-size: 12px; font-weight: 650; }
    h1 { font-size: 31px; line-height: 1.45; letter-spacing: -.025em; margin: 16px 0 20px; }
    .meta { font-size: 12px; color: #8590a3; padding-bottom: 22px; border-bottom: 1px solid #e7ebf2; }
    .article p { margin: 22px 0; }
    .promo { border: 1px dashed #cbd5e3; color: #8b96a8; padding: 18px; text-align: center; border-radius: 8px; }
    .endnote { color: #8b96a8; font-size: 11px; }
  </style>
</head>
<body>
  <header><div class="brand">Reading <span>Notes.</span></div><div class="sample">スクリーンショット用のローカルサンプル</div></header>
  <div class="layout">
    <aside><strong>小さな読みもの</strong><p>すべての記事</p><p>暮らしのこと</p><p>仕事の工夫</p><p>お気に入り</p></aside>
    <main class="article">
      <div class="reading-badge">READING NOTES / ESSAY</div>
      <h1>小さな工夫を、<br>毎日の習慣に。</h1>
      <div class="meta">暮らしのこと · 5 min read</div>
      <p>読みやすい文字。目にやさしい配色。気持ちのよい余白。いつも使う道具は、ほんの少し整えるだけで、ずっと使いやすくなります。</p>
      <div class="promo">おすすめコンテンツ</div>
      <p>自分にとってちょうどいい形は、人それぞれ。大きく変える必要はありません。気になるところから、ひとつずつ試してみましょう。</p>
      <p class="endnote">この文章とページは拡張の紹介用に作成したサンプルです。</p>
    </main>
  </div>
</body>
</html>
